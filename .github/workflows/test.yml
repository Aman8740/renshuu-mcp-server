name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 = current Node LTS at time of writing, 22 = what this project
        # was actually developed/tested against. Running both catches
        # version-specific regressions (e.g. the node:test API has moved
        # between versions before) without needing every version.
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Run offline test suite (unit + in-process MCP protocol + multi-tenant HTTP)
        run: node --test dist/__tests__/*.test.js

      - name: Confirm no accidental process.exit in HTTP request path
        # Cheap static guard against regressing the multi-tenant crash bug
        # this project was specifically fixed for: buildServer() must never
        # be the thing that calls process.exit — only the stdio CLI path may.
        run: |
          if grep -n "process.exit" src/index.ts | grep -v "runStdio\|catch (error)"; then
            echo "::warning::process.exit found outside the stdio-only paths in src/index.ts — verify this doesn't affect HTTP mode's multi-tenant reliability."
          fi
